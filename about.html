  <main>
    <h2>このサイトについて</h2>

    <section class="case-card">
      <h3>サイトの目的</h3>
      <p>
        実際に経験した自動車の修理事例や故障診断の記録を公開し、
        整備に役立つ情報を蓄積することを目的としています。
      </p>

      <h3>掲載する情報</h3>
      <ul>
        <li>車種・型式・エンジン型式</li>
        <li>入庫時の症状と故障コード</li>
        <li>点検・診断の手順</li>
        <li>実施した修理内容</li>
        <li>修理後の確認結果</li>
      </ul>

      <h3>掲載情報について</h3>
      <p>
        記事は実際に確認した内容を中心に作成します。
        車種や仕様によって整備方法が異なるため、
        自身で作業する際は該当車両の整備情報を確認してください。
      </p>
    </section>

    <p><a href="index.html">← トップページに戻る</a></p>
